{% extends "base.html" %}

{% block title %}Страница не найдена — Catcoin Store{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card">
        <div class="error-icon">😿</div>
        <h1>404</h1>
        <h2>Страница не найдена</h2>
        <p>Мяу... Такой страницы не существует. Возможно, она была удалена или вы ошиблись при вводе адреса.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">🐾 Вернуться в каталог</a>
    </div>
</div>
{% endblock %}
