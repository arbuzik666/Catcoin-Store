{% extends "base.html" %}

{% block title %}Редактировать товар — Catcoin Admin{% endblock %}

{% block content %}
<div class="admin-page">
    <h1>✏️ Редактировать: {{ product.name.capitalize() }}</h1>
    
    <div class="admin-form-card">
        <form method="POST" action="{{ url_for('admin.edit_product', product_id=product.id) }}" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Название товара *</label>
                <input type="text" name="name" class="form-input" required value="{{ product.name.capitalize() }}">
            </div>
            
            <div class="form-group">
                <label>Описание</label>
                <textarea name="description" class="form-input form-textarea" rows="4">{{ product.description }}</textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Цена (₽) *</label>
                    <input type="number" name="price" class="form-input" required 
                        min="0" max="99999999" step="1" value="{{ '%.0f'|format(product.price) }}">
                </div>
                <div class="form-group">
                    <label>Количество на складе</label>
                    <input type="number" name="stock" class="form-input" 
                        min="0" max="999999" value="{{ product.stock }}">
                </div>
            </div>
            
            <div class="form-group">
                <label>Картинка товара</label>
                
                
                <div class="current-image">
                    <p>Текущая картинка:</p>
                    <img src="{{ product.get_image_url() }}" alt="{{ product.name.capitalize() }}" class="current-image-preview"onerror="this.src='{{ url_for('static', filename='images/default_product.png') }}'">
                </div>
                
                
                <div class="image-upload-area">
                    <input type="file" name="image" id="imageInput" class="image-input" 
                           accept="image/png, image/jpeg, image/gif, image/webp">
                    <label for="imageInput" class="image-upload-label">
                        <div class="upload-placeholder">
                            <span class="upload-icon">📷</span>
                            <span>Нажми, чтобы заменить картинку</span>
                            <span class="upload-hint">Оставь пустым, чтобы не менять</span>
                        </div>
                    </label>
                    <div class="image-preview" id="imagePreview" style="display: none;">
                        <img id="previewImg" src="" alt="Предпросмотр">
                        <button type="button" class="btn-remove-image" onclick="clearImage()">✕</button>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Категории</label>
                <div class="checkbox-group">
                    {% for category in categories %}
                    <label class="checkbox-label">
                        <input type="checkbox" name="categories" value="{{ category.id }}"
                               {% if category in product.categories %}checked{% endif %}>
                        {{ category.name }}
                    </label>
                    {% endfor %}
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
                <a href="{{ url_for('admin.admin_products') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('previewImg').src = event.target.result;
            document.getElementById('imagePreview').style.display = 'block';
            document.querySelector('.upload-placeholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
});

function clearImage() {
    document.getElementById('imageInput').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.querySelector('.upload-placeholder').style.display = 'flex';
}
</script>
{% endblock %}
